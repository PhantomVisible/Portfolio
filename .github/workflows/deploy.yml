name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master" if that is your default branch
  workflow_dispatch: # Allows you to run this manually from the Actions tab

# Set permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Standard for modern Angular
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href /Portfolio/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Angular 17+ outputs to dist/project-name/browser.
          path: "dist/portfolio/browser"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
